receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['0.0.0.0:8888']

        - job_name: 'rabbitmq'
          static_configs:
            - targets: ['rabbitmq:15692']

        - job_name: 'postgres'
          static_configs:
            - targets: ['postgres-exporter:9187']

        - job_name: 'keycloak'
          metrics_path: /metrics
          static_configs:
            - targets: ['keycloak:8080']

processors:
  batch:
  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  otlp:
    endpoint: "awe-aspire-dashboard:18889"
    tls:
      insecure: true
    headers:
      x-otlp-api-key: "${DASHBOARD_OTLP_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp, prometheus]
      processors: [resourcedetection, batch]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp]
